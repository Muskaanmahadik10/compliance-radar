name: ci
on: [push, pull_request]

permissions:
  contents: read

jobs:
  local-mode:
    name: tests (local mode, no services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: python -m pytest -q --cov=radar --cov-report=xml --cov-report=term
        env: { RADAR_MODE: local, RADAR_LLM_PROVIDER: mock }
      # Coverage upload. Public repos can upload without a token only if the Codecov
      # org setting "Token authentication for public repositories" is turned off.
      # TODO(owner): sign in at codecov.io, then either turn that setting off or add the
      # repository secret CODECOV_TOKEN. Until then this step may fail; it does not fail CI.
      - uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v5.5.1
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          files: coverage.xml
          flags: local-mode
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  compose-mode:
    name: tests (real Qdrant, Redis, Postgres)
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports: ["6333:6333"]
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: radar, POSTGRES_PASSWORD: radar, POSTGRES_DB: radar }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U radar" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q --cov=radar --cov-report=xml --cov-report=term
        env:
          RADAR_MODE: compose
          RADAR_LLM_PROVIDER: mock
          RADAR_QDRANT_URL: http://localhost:6333
          RADAR_REDIS_URL: redis://localhost:6379/0
          RADAR_DATABASE_URL: postgresql+psycopg://radar:radar@localhost:5432/radar
      - uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v5.5.1
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          files: coverage.xml
          flags: compose-mode
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
