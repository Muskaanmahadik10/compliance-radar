[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance-radar"
version = "0.1.0"
description = "Real-time compliance and supplier-risk copilot for electronics manufacturers: streaming ingestion, hybrid RAG with reranking, LangGraph multi-agent briefs with human review, evals and tracing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2", "langchain-core>=0.3", "langchain-openai>=0.2", "langchain-anthropic>=0.2",
  "qdrant-client>=1.12", "fastembed>=0.4",
  "redis>=5", "fakeredis>=2.26",
  "sqlalchemy>=2", "psycopg[binary]>=3.1",
  "fastapi>=0.110", "uvicorn>=0.27", "sse-starlette>=2",
  "pydantic>=2.5", "pydantic-settings>=2.1", "httpx>=0.26", "python-dotenv>=1",
  "feedparser>=6", "datasketch>=1.6", "langdetect>=1.0.9",
  "langfuse>=2.50", "opentelemetry-sdk>=1.25",
  "pypdf>=4", "reportlab>=4",
]

[project.optional-dependencies]
ui = ["streamlit>=1.32", "plotly>=5.18"]
eval = ["ragas>=0.2", "datasets>=2.19"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3.7"]

[tool.setuptools.packages.find]
include = ["radar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::UserWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
