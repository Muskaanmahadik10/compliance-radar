services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
    healthcheck: { test: ["CMD-SHELL", "wget -qO- http://localhost:6333/readyz || exit 1"], interval: 10s, timeout: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 10s, timeout: 5s, retries: 10 }

  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: radar, POSTGRES_PASSWORD: radar, POSTGRES_DB: radar }
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U radar"], interval: 10s, timeout: 5s, retries: 10 }

  langfuse-db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: langfuse, POSTGRES_PASSWORD: langfuse, POSTGRES_DB: langfuse }
    volumes: ["langfuse_pg:/var/lib/postgresql/data"]

  langfuse:
    image: langfuse/langfuse:2
    depends_on: [langfuse-db]
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: change-me
      SALT: change-me
      TELEMETRY_ENABLED: "false"

  api:
    build: .
    command: uvicorn radar.api:app --host 0.0.0.0 --port 8000
    environment: &radar_env
      RADAR_MODE: compose
      RADAR_QDRANT_URL: http://qdrant:6333
      RADAR_REDIS_URL: redis://redis:6379/0
      RADAR_DATABASE_URL: postgresql+psycopg://radar:radar@postgres:5432/radar
      RADAR_LANGFUSE_HOST: http://langfuse:3000
    env_file: [.env]
    ports: ["8000:8000"]
    depends_on: { qdrant: { condition: service_healthy }, redis: { condition: service_healthy }, postgres: { condition: service_healthy } }

  worker:
    build: .
    command: python -m radar.ingest.worker
    environment: *radar_env
    env_file: [.env]
    depends_on: [api]

  ui:
    build: .
    command: streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8501
    environment: *radar_env
    env_file: [.env]
    ports: ["8501:8501"]
    depends_on: [api]

volumes:
  qdrant_data: {}
  pg_data: {}
  langfuse_pg: {}
